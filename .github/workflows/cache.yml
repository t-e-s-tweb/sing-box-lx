name: lx-release cache

# Cross-builds the drop-in `sing-box` binary for all platforms and publishes a
# GitHub Release with archives + checksums. Triggered by pushing a tag like
# v1.13.13-lx.1, or manually via workflow_dispatch. See SPECS/TASKS/004.
#
# lx: dry_run (workflow_dispatch only) runs the whole release matrix — windows incl.
# Win7, linux mips, darwin, linux-musl, both AARs — and skips `publish release`:
# no GitHub Release, no tag on origin, the artifacts stay on the run. The full
# release build to run after a toolchain or dependency bump without cutting a tag
# (docs-lx/lx-release-runbook.md §2b).

on:
  push:
    tags: ['v*-lx.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.13.13-lx.1 (created at the current ref if missing; with dry_run it only stamps the version, use a -dryrun suffix)'
        required: true
      dry_run:
        description: 'Build every release artifact but do not publish (no release, no tag)'
        type: boolean
        default: false

permissions:
  contents: write

# Build tags are owned by Makefile.lx (single source of truth). The desktop/CLI build
# uses its LX_TAGS default (which KEEPS with_clash_api — CLI binaries are driven by
# external dashboards over the Clash REST API); the Android AAR uses build_libbox's own
# tag set (which DROPS with_clash_api — LxBox uses the native CommandClient). The two
# sets diverge by design. `make -f Makefile.lx -s lx-print-tags` prints the desktop set
# for the release notes so nothing is duplicated here.

jobs:
  build_android:
    name: build android (libbox.aar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      # SPEC 044: the AAR MUST be built with Go >= 1.25. A go1.24-built libbox
      # kills every quic-go outbound (hysteria2/tuic/masque-h3) on some vendor
      # Android kernels inside the VPN process — "context deadline exceeded"
      # on each dial while TCP and wireguard-go UDP work (device-verified on
      # OnePlus Nord CE 2 / MTK / Android 15; the same source built with
      # go1.25.5 works on the same device, GSO/ECN knobs ruled out). go.mod
      # still says `go 1.24.x` (upstream parity), so go-version-file would
      # silently downgrade the toolchain here — the pin lives in go.version
      # (SPEC 049), which F-Droid also reads to build the AAR from source.
      - name: Go toolchain pin
        id: go_pin
        run: echo "version=$(tr -d '[:space:]' < go.version | sed 's/^go//')" >> "$GITHUB_OUTPUT"

      # Cache Go module cache, sumdb, build cache, and GOPATH/bin (gomobile, gobind,
      # stringer installed by `make lib_install`). Keyed on the pinned toolchain
      # version + the full module graph + the tool set defined in Makefile.lx, so a
      # gomobile bump invalidates even when go.sum is untouched.
      - name: Cache Go (modules, build, tools)
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/pkg/sumdb
            ~/.cache/go-build
            ~/go/bin
          key: go-${{ runner.os }}-${{ steps.go_pin.outputs.version }}-${{ hashFiles('**/go.sum', 'go.version', 'Makefile.lx') }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go_pin.outputs.version }}-
            go-${{ runner.os }}-

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go_pin.outputs.version }}
          # We manage the module cache ourselves above; disable setup-go's built-in
          # module-only cache to avoid a second, redundant downloader and a cache
          # race on ~/go/pkg/mod.
          cache: false

      # nttld/setup-ndk re-downloads ~1GB on every run unless told to cache.
      # cache: true keys on ndk-version, so r28c is fetched once per cache lifetime.
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          # lx: r28c = 28.2.13676358 — совпадает с локальным NDK. Прежнее `r28` не
          # алиас на последнюю ревизию, а отдельный архив от 05.02.2025.
          ndk-version: r28c
          cache: true

      - name: Setup OpenJDK 17
        run: sudo apt-get update && sudo apt-get install -y openjdk-17-jdk-headless

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # build_libbox stamps Libbox.version() from `git describe` — ensure the tag exists.
          git tag "$TAG" -f

      - name: Build libbox.aar (with_xhttp + with_awg baked in by build_libbox)
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      # Explicitly save the Go caches on every outcome (including partial builds), so
      # a run that warmed ~/.cache/go-build before failing still contributes to the
      # next run's restore. actions/cache@v4's post-step already saves on success;
      # this step covers the failure path too. Harmless duplicate on the happy path
      # (same key, second write is a no-op).
      - name: Save Go caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/pkg/sumdb
            ~/.cache/go-build
            ~/go/bin
          key: go-${{ runner.os }}-${{ steps.go_pin.outputs.version }}-${{ hashFiles('**/go.sum', 'go.version', 'Makefile.lx') }}

      - name: Package AARs
        run: |
          mkdir -p dist
          V="${{ steps.ver.outputs.version }}"
          cp libbox.aar "dist/libbox-$V.aar"
          cp libbox-legacy.aar "dist/libbox-legacy-$V.aar"

      - uses: actions/upload-artifact@v6
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [build_android]
    # lx: a tag push carries no inputs — always publish there; a manual run publishes
    # unless dry_run. The implicit success() on `needs` still applies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # Derive the upstream base version for the release notes instead of hardcoding it
          # (it drifted to alpha.35 across rc.14/15/16 and had to be hand-fixed each time).
          # Primary source: the nearest reachable upstream tag in HEAD's ancestry
          # (`git describe`). This reads the commit GRAPH, not commit-message text, so it's
          # correct even when a merge subject omits the version — e.g. alpha.37 was
          # merged in a commit titled "Merge upstream/testing (bump version, fix linux ping)"
          # with no "alpha.37" in it, which the subject-grep fallback misses (shipped rc.17/18
          # notes as alpha.36). The match is ANY upstream version tag minus our v*-lx* tags —
          # a pattern pinned to one phase goes stale when upstream moves on (hardcoded
          # 'v1.14.0-alpha.*' kept reporting alpha.50 across lx.16-rc.1..3 after beta.2 was
          # merged). Fallback: the most recent upstream version mentioned in a merge subject.
          # Last resort: a generic label so notes never carry a stale hardcoded version.
          #
          # NOTE: actions/checkout only fetches THIS repo's tags, not upstream's. Without
          # this fetch `git describe` finds nothing in CI and silently drops to the weaker
          # subject-grep (which is why CI kept resolving alpha.36 while a local clone with
          # upstream tags gets 37). Upstream has no v*-lx* tags, so the refspec cannot
          # clobber ours.
          git remote add upstream https://github.com/SagerNet/sing-box.git 2>/dev/null || true
          git fetch --no-tags upstream 'refs/tags/v*:refs/tags/v*' 2>/dev/null || true
          BASE="$(git describe --tags --match 'v*' --exclude 'v*-lx*' --abbrev=0 HEAD 2>/dev/null || true)"
          if [ -z "$BASE" ]; then
            BASE="$(git log --grep='Merge' --pretty=%s | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?' | head -1)"
          fi
          [ -z "$BASE" ] && BASE="v1.14.x"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream base: $BASE"

      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: Release notes
        run: |
          # What's-new for THIS tag comes from one of two sources, in order of preference:
          #   1. docs-lx/releases/v<version>.md — hand-written bilingual notes in the
          #      LxBox release format (TL;DR paragraphs EN+RU, then EN/RU <details> blocks
          #      with 🆕/🔧/🐛/🧰 sections; see docs-lx/releases/TEMPLATE.md). Expected for
          #      every stable tag; optional for pre-releases.
          #   2. Fallback: the "#### v<version>" section of docs-lx/lx-changelog.md — the
          #      terse engineering log, good enough for rc/alpha/beta pre-releases.
          # Either source must NOT be interpolated through the heredoc below: prose contains
          # backticks and $(...) that the shell would execute (command injection from doc
          # text). We splice the file in with sed after the heredoc instead.
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          if [ -s "docs-lx/releases/v${VERSION}.md" ]; then
            cp "docs-lx/releases/v${VERSION}.md" changes.md
          else
            case "$TAG" in
              *-rc.*|*-alpha.*|*-beta.*) : ;;
              *) echo "::warning::stable tag without docs-lx/releases/v${VERSION}.md — release page falls back to the raw changelog section" ;;
            esac
            awk -v v="#### v${VERSION}" '
              $0==v {f=1; next} /^#### / {f=0} f' docs-lx/lx-changelog.md > section.md
            if [ -z "$(tr -d '[:space:]' < section.md)" ]; then
              echo "See [docs-lx/lx-changelog.md](https://github.com/Leadaxe/sing-box-lx/blob/lx/docs-lx/lx-changelog.md)." > section.md
            fi
            { echo "### What's new in this release"; echo; cat section.md; } > changes.md
          fi
          cat > notes.md <<EOF
          **sing-box-lx ${VERSION}** — a thin downstream of [sing-box](https://github.com/SagerNet/sing-box) (base **${{ steps.ver.outputs.base }}**, branch \`lx\`).

          __CHANGES__

          ---

          Config reference: [docs-lx/lx-config.md](https://github.com/Leadaxe/sing-box-lx/blob/lx/docs-lx/lx-config.md) · verify downloads against \`SHA256SUMS\` · \`sing-box version\` reports \`${VERSION}\`.

          <details>
          <summary><b>📦 Binaries / Сборки</b></summary>

          Drop-in \`sing-box\` for **darwin / windows** × {amd64, arm64}, plus a **Windows 7 (32-bit)** legacy build (\`sing-box-${VERSION}-windows-386-legacy-windows-7.zip\` — built with a Win7-patched Go; without naive/cronet, which has no windows/386 target).

          Windows archives include \`libcronet.dll\` — keep it next to \`sing-box.exe\`, the \`naive\` outbound loads it from there. The darwin binaries are built with CGO on a macOS runner: \`libcronet.a\` is linked statically, so NaïveProxy works with nothing extra to install (tag set drops \`with_purego\` there).

          **Linux — static musl builds for routers** (AsusWRT Merlin, OpenWrt, Keenetic): \`linux-amd64\`, \`linux-arm64\`, \`linux-armv7\`, \`linux-mipsle-softfloat\`, \`linux-386\` (SSE2), \`linux-riscv64\`. These are statically linked (no \`libdl.so.2\`/glibc dependency) and **keep NaïveProxy** — they run on musl routers where the previous dynamic builds failed with \`libdl.so.2: cannot open shared object file\`. See SPECS/TASKS/006.

          **Linux — big-endian MIPS** (OpenWrt \`mips_24kc\`, e.g. Atheros AR93xx): \`linux-mips-softfloat\` — pure-Go static build **without NaïveProxy** (Chromium/cronet has no big-endian MIPS toolchain); everything else matches the desktop tag set.

          **Linux — UPX-packed copies**: \`linux-arm64.upx.tar.gz\` and \`linux-mipsle-softfloat.upx.tar.gz\` — the same binary packed with UPX (\`--best --lzma\`, version pinned in the workflow), for routers with a small flash overlay and no USB: ~17 MB on flash instead of 75–90 MB (the download itself is only ~1.6× smaller). The binary unpacks itself into RAM at every start: about +17 MB RSS (measured on x86) and a cold start of 15–20 s on mipsle. Some older router kernels refuse the packed binary — if it does not start, use the plain archive. \`sing-box lxd update\` keeps a packed binary packed: it takes the \`.upx\` copy of the new release (the plain archive only when a release has none, and only if it fits beside the binary).

          </details>

          <details>
          <summary><b>🤖 Android AAR</b></summary>

          \`libbox-${VERSION}.aar\` (+ \`libbox-legacy-…\` for SDK 21) — gomobile build of \`experimental/libbox\` with \`with_xhttp\`+\`with_awg\` enabled, for embedding in an Android app. \`Libbox.version()\` reports the lx version.

          </details>

          <details>
          <summary><b>🏷️ Standing lx features &amp; build tags / Постоянные фичи форка</b></summary>

          - **AmneziaWG 2.0** (\`with_awg\`) — \`wireguard\` endpoint with \`jc/jmin/jmax\`, \`s1\`–\`s4\`, \`h1\`–\`h4\`, \`i1\`–\`i5\`.
          - **XHTTP** transport (\`with_xhttp\`) — Xray-compatible "splithttp", composes with Reality (use \`auto\`; \`stream-one\` has a known framing bug).
          - **CommandClient extensions** (\`with_lx_command\`) — native libbox gRPC parity for the Clash API dropped from the **Android AAR**: URLTestOutbound, GetRules, GetGroups/GetOutbounds, Connection.Detour, SubscribeDNSQueries. (Desktop/CLI binaries keep \`with_clash_api\` for external dashboards.)
          - **Tailscale** (\`with_tailscale\`) — upstream \`tailscale\` endpoint, DNS transport and DERP service, in the desktop and router binaries **and in the Android AAR** (there with upstream's \`ts_omit_*\` trims).

          Desktop binary build tags: \`$(make -f Makefile.lx -s lx-print-tags)\`

          </details>
          EOF

          # Previous-release footer (LxBox-style): the nearest v*-lx* tag in this tag's own
          # history, not the newest tag by date — with two release lines alive (1.14 on lx,
          # 1.15 prereleases on lx-1.15) the date order pointed v1.14.4-lx.32 at
          # v1.15.0-lx.1-rc.1. History and tags are complete here: checkout runs with
          # fetch-depth 0, and the upstream tag fetch above cannot add v*-lx* tags.
          PREV="$(git describe --tags --abbrev=0 --match 'v*-lx*' "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            printf '\n---\n\nPrevious release / Предыдущий релиз: [%s](https://github.com/%s/releases/tag/%s)\n' \
              "$PREV" "${{ github.repository }}" "$PREV" >> notes.md
          fi

          # Splice the what's-new content in place of the placeholder. `sed r` inserts the
          # file verbatim (no shell/sed interpretation of its contents), so backticks and
          # $(...) in the prose are inert. Then drop the placeholder line itself. Written
          # via a temp file (not sed -i, whose flag syntax differs BSD vs GNU).
          sed -e '/__CHANGES__/r changes.md' -e '/__CHANGES__/d' notes.md > notes.final.md
          mv notes.final.md notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pre-release tags (-rc.N / -alpha.N / -beta.N) publish as GitHub
          # pre-releases so an unverified build never becomes "Latest". A plain
          # vX.Y.Z-lx.N tag (no such suffix) publishes as a normal release.
          EXTRA=""
          case "${{ steps.ver.outputs.tag }}" in
            *-rc.*|*-alpha.*|*-beta.*) EXTRA="--prerelease" ;;
          esac
          # --repo is REQUIRED: the base-version step adds an `upstream` remote
          # (SagerNet/sing-box) so git-describe can see the alpha tags, and without
          # --repo `gh` resolves the target repo from the remotes and picks upstream
          # → HTTP 403 (the token has no rights there). Pin it to this repo.
          gh release create "${{ steps.ver.outputs.tag }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "sing-box-lx ${{ steps.ver.outputs.version }}" \
            --notes-file notes.md \
            $EXTRA
